services:
  - type: web
    name: safetyband-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safetyband_db
          property: connectionString
      - key: JWT_SECRET
        sync: false
